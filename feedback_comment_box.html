
<h2 class="sr-only">Interactive feedback comment box with live character count, rating selector, and submission preview</h2>
<style>
  .fb-wrap { max-width: 520px; margin: 1.5rem auto; font-family: var(--font-sans); }
  .fb-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.5rem; }
  .fb-label { font-size: 13px; color: var(--color-text-secondary); margin: 0 0 6px; display: block; }
  .fb-name { width: 100%; box-sizing: border-box; margin-bottom: 1rem; }
  .fb-stars { display: flex; gap: 6px; margin-bottom: 1rem; }
  .star { font-size: 22px; cursor: pointer; color: var(--color-border-tertiary); transition: color 0.15s; line-height: 1; }
  .star.active { color: #EF9F27; }
  .fb-textarea { width: 100%; box-sizing: border-box; min-height: 110px; resize: vertical; }
  .fb-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .fb-count { font-size: 12px; color: var(--color-text-tertiary); }
  .fb-count.warn { color: var(--color-text-warning); }
  .fb-btn { padding: 8px 20px; border-radius: var(--border-radius-md); background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); font-size: 14px; font-weight: 500; cursor: pointer; color: var(--color-text-primary); transition: background 0.12s; }
  .fb-btn:hover { background: var(--color-background-secondary); }
  .fb-btn:active { transform: scale(0.98); }
  .fb-success { display: none; text-align: center; padding: 2rem 1rem; }
  .fb-success-icon { font-size: 32px; margin-bottom: 12px; }
  .fb-success p { margin: 0; color: var(--color-text-secondary); font-size: 15px; }
  .fb-err { font-size: 12px; color: var(--color-text-danger); margin-top: 4px; display: none; }
</style>

<div class="fb-wrap">
  <div class="fb-card" id="fb-form">
    <p style="font-size: 17px; font-weight: 500; margin: 0 0 1.25rem;">Share your feedback</p>

    <label class="fb-label" for="fb-name">Your name <span style="color:var(--color-text-tertiary)">(optional)</span></label>
    <input class="fb-name" type="text" id="fb-name" placeholder="e.g. Alex">

    <label class="fb-label">Rating</label>
    <div class="fb-stars" id="stars" role="group" aria-label="Star rating">
      <span class="star" data-v="1" role="button" tabindex="0" aria-label="1 star">★</span>
      <span class="star" data-v="2" role="button" tabindex="0" aria-label="2 stars">★</span>
      <span class="star" data-v="3" role="button" tabindex="0" aria-label="3 stars">★</span>
      <span class="star" data-v="4" role="button" tabindex="0" aria-label="4 stars">★</span>
      <span class="star" data-v="5" role="button" tabindex="0" aria-label="5 stars">★</span>
    </div>

    <label class="fb-label" for="fb-msg">Message</label>
    <textarea class="fb-textarea" id="fb-msg" placeholder="Tell us what you think..." maxlength="300"></textarea>
    <div class="fb-err" id="fb-err">Please write a message before submitting.</div>

    <div class="fb-footer">
      <span class="fb-count" id="fb-count">0 / 300</span>
      <button class="fb-btn" id="fb-submit">Submit</button>
    </div>
  </div>

  <div class="fb-success" id="fb-success">
    <div class="fb-success-icon">✓</div>
    <p id="fb-thanks">Thanks for your feedback!</p>
    <button class="fb-btn" style="margin-top:1rem;" id="fb-reset">Submit another</button>
  </div>
</div>

<script>
  let rating = 0;
  const stars = document.querySelectorAll('.star');
  const msg = document.getElementById('fb-msg');
  const count = document.getElementById('fb-count');
  const err = document.getElementById('fb-err');
  const form = document.getElementById('fb-form');
  const success = document.getElementById('fb-success');
  const thanks = document.getElementById('fb-thanks');

  function setStars(n) {
    rating = n;
    stars.forEach(s => s.classList.toggle('active', parseInt(s.dataset.v) <= n));
  }

  stars.forEach(s => {
    s.addEventListener('click', () => setStars(parseInt(s.dataset.v)));
    s.addEventListener('mouseover', () => stars.forEach(x => x.classList.toggle('active', parseInt(x.dataset.v) <= parseInt(s.dataset.v))));
    s.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') setStars(parseInt(s.dataset.v)); });
  });
  document.getElementById('stars').addEventListener('mouseleave', () => setStars(rating));

  msg.addEventListener('input', () => {
    const n = msg.value.length;
    count.textContent = n + ' / 300';
    count.classList.toggle('warn', n > 260);
    if (n > 0) err.style.display = 'none';
  });

  document.getElementById('fb-submit').addEventListener('click', () => {
    if (!msg.value.trim()) { err.style.display = 'block'; return; }
    const name = document.getElementById('fb-name').value.trim();
    const stars_txt = rating ? ' · ' + '★'.repeat(rating) + '☆'.repeat(5 - rating) : '';
    thanks.textContent = 'Thanks' + (name ? ', ' + name : '') + '! We got your feedback.' + stars_txt;
    form.style.display = 'none';
    success.style.display = 'block';
  });

  document.getElementById('fb-reset').addEventListener('click', () => {
    msg.value = ''; count.textContent = '0 / 300'; rating = 0;
    setStars(0); document.getElementById('fb-name').value = '';
    err.style.display = 'none';
    success.style.display = 'none'; form.style.display = 'block';
  });
</script>
